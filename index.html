<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoPrecinho</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#121214">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<link rel="icon" type="image/png" href="./assets/icon-192.png">
<script>try{var _s=JSON.parse(localStorage.getItem("groceryTracker.settings.v2")||"{}");var _p=_s.palette||"coral";document.documentElement.setAttribute("data-theme",_s.theme==="light"?_p+"-light":_p);}catch(e){}</script>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<main>
  <header>
    <h1><span class="brand">NoPrecinho</span> <span class="tt" data-i18n="title"></span></h1>
    <div class="hbtns">
    <button type="button" class="iconbtn" id="themeBtn">
      <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button type="button" class="iconbtn" id="openSettings" data-i18n-aria="settings" title="">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>
    </button>
    </div>
  </header>
  <p class="lead" data-i18n="lead"></p>
  <div id="storageNote" class="note" hidden data-i18n="storageNote"></div>

  <section class="panel" aria-labelledby="sumH">
    <div class="bar">
      <h2 id="sumH" data-i18n="summary"></h2>
      <div class="acts"><button type="button" class="ghost" id="openCheck" data-i18n="btnCheck"></button><button type="button" class="ghost" id="openStores" data-i18n="btnStores"></button><button type="button" id="openAdd" data-i18n="newPurchase"></button></div>
    </div>
    <div id="tableWrap"></div>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <footer>
    <p data-i18n="tagline"></p>
    <p><a href="mailto:diegobottan@pm.me">diegobottan@pm.me</a><span class="sep" aria-hidden="true">·</span><a href="https://github.com/bottandiego" target="_blank" rel="noopener noreferrer">github.com/bottandiego</a></p>
  </footer>
</main>

<dialog id="addDlg" aria-labelledby="addH">
  <form id="form" novalidate>
    <div class="dlghead"><h2 id="addH" data-i18n="newPurchase"></h2></div>
    <div class="field">
      <label for="product" data-i18n="fProduct"></label>
      <input id="product" list="productList" maxlength="60" autocomplete="off" data-i18n-ph="phProduct" aria-describedby="productErr">
      <datalist id="productList"></datalist>
      <span class="err" id="productErr"></span>
    </div>
    <div class="field">
      <label for="price" data-i18n="fPrice"></label>
      <input id="price" inputmode="decimal" autocomplete="off" data-i18n-ph="phPrice" aria-describedby="priceErr">
      <span class="err" id="priceErr"></span>
    </div>
    <div class="field">
      <label for="size" data-i18n="fSize"></label>
      <div class="row2">
        <input id="size" inputmode="decimal" autocomplete="off" data-i18n-ph="phSize" aria-describedby="sizeErr sizeHint">
        <select id="unit" data-i18n-aria="fUnit"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="L">L</option><option value="un">un</option></select>
      </div>
      <span class="hint" id="sizeHint" data-i18n="sizeHint" style="margin:0"></span>
      <span class="err" id="sizeErr"></span>
    </div>
    <div class="field">
      <label for="store" data-i18n="fStore"></label>
      <input id="store" list="storeList" maxlength="60" autocomplete="off" data-i18n-ph="phStore" aria-describedby="storeErr">
      <datalist id="storeList"></datalist>
      <span class="err" id="storeErr"></span>
    </div>
    <p class="hint" data-i18n="addHint"></p>
    <div id="dymBanner" class="dym" hidden role="alert">
      <p id="dymMsg"></p>
      <div class="dlgfoot" style="margin-top:8px">
        <button type="button" class="ghost small" id="dymNo"></button>
        <button type="button" class="small" id="dymYes"></button>
      </div>
    </div>
    <div class="dlgfoot">
      <button type="button" class="ghost" id="cancelAdd" data-i18n="cancel"></button>
      <button type="submit" data-i18n="savePurchase"></button>
    </div>
  </form>
</dialog>

<dialog id="qcDlg" aria-labelledby="qcH">
  <div class="dlghead"><h2 id="qcH" data-i18n="qTitle"></h2><button type="button" class="ghost small" id="qcClose" data-i18n="close"></button></div>
  <p class="hint" data-i18n="qHint"></p>
  <div class="field"><label for="qcProd" data-i18n="fProduct"></label><input id="qcProd" list="productList" autocomplete="off"></div>
  <div class="field"><label for="qcPrice" data-i18n="fPrice"></label><input id="qcPrice" inputmode="decimal" autocomplete="off" data-i18n-ph="phPrice"></div>
  <div class="field"><label for="qcSize" data-i18n="fSize"></label><div class="row2"><input id="qcSize" inputmode="decimal" autocomplete="off" data-i18n-ph="phSize"><select id="qcUnit" data-i18n-aria="fUnit"><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="L">L</option><option value="un">un</option></select></div></div>
  <div id="qcOut" role="status" aria-live="polite"></div>
</dialog>
<dialog id="siDlg" aria-labelledby="siH">
  <div class="dlghead"><h2 id="siH" data-i18n="sTitle"></h2><button type="button" class="ghost small" id="siClose" data-i18n="close"></button></div>
  <p class="hint" data-i18n="sHint"></p>
  <div id="siOut"></div>
</dialog>

<dialog id="setDlg" aria-labelledby="setH">
  <div class="dlghead">
    <h2 id="setH" data-i18n="settings"></h2>
    <button type="button" class="ghost small" id="closeSet" data-i18n="close"></button>
  </div>
  <div class="field">
    <label for="lang" data-i18n="fLang"></label>
    <select id="lang"><option value="pt">Português (Brasil)</option><option value="en">English</option></select>
  </div>
  <div class="field">
    <label for="palette" data-i18n="fPalette"></label>
    <select id="palette"><option value="coral">Coral</option><option value="slate">Slate</option><option value="stone">Stone</option><option value="indigo">Indigo</option></select>
  </div>
  <div class="field">
    <label for="currency" data-i18n="fCurrency"></label>
    <input id="currency" maxlength="4" placeholder="R$">
  </div>
  <div class="field">
    <label for="decimal" data-i18n="fDecimal"></label>
    <select id="decimal"><option value="," data-i18n="decComma"></option><option value="." data-i18n="decDot"></option></select>
  </div>
  <hr>
  <h3 class="sec" data-i18n="fsaTitle"></h3>
  <p id="fsaHintEl" class="hint" style="margin-bottom:8px"></p>
  <div class="toolbar"><button type="button" class="ghost" id="fsaBtn"></button></div>
  <hr>
  <h3 class="sec" data-i18n="impTitle"></h3>
  <p class="hint" style="margin-bottom:8px" data-i18n="impHint"></p>
  <input type="file" id="impFile" accept=".csv,text/csv,text/plain" hidden>
  <div class="toolbar">
    <button type="button" class="ghost" id="impBtn" data-i18n="impBtn"></button>
    <button type="button" class="ghost" id="expSummary" data-i18n="expSummary"></button>
    <button type="button" class="ghost" id="expLog" data-i18n="expLog"></button>
    <button type="button" class="ghost" id="openMerge" data-i18n="mergeTitle"></button>
  </div>
  <p id="impMsg" role="status" aria-live="polite"></p>
  <hr>
  <div class="toolbar">
    <button type="button" class="danger" id="wipe"></button>
  </div>
  <p id="localHint" class="hint" style="margin-top:14px"></p>
</dialog>

<dialog id="mergeDlg" aria-labelledby="mergeH">
  <div class="dlghead">
    <h2 id="mergeH" data-i18n="mergeTitle"></h2>
    <button type="button" class="ghost small" id="closeMerge" data-i18n="close"></button>
  </div>
  <p class="hint" data-i18n="mergeHint"></p>
  <div class="field">
    <label for="mergeKeep" data-i18n="mergeA"></label>
    <select id="mergeKeep"></select>
  </div>
  <div class="field">
    <label for="mergeRemove" data-i18n="mergeB"></label>
    <select id="mergeRemove"></select>
  </div>
  <div class="dlgfoot">
    <button type="button" id="mergeBtn" data-i18n="mergeBtn"></button>
  </div>
  <p id="mergeMsg" role="status" aria-live="polite" style="margin-top:10px;font-size:.85rem"></p>
</dialog>

<div id="scrim"></div>
<aside id="drawer" aria-labelledby="calcH" aria-hidden="true">
  <div class="dlghead">
    <h2 id="calcH"></h2>
    <button type="button" class="ghost small" id="closeCalc" data-i18n="close"></button>
  </div>
  <div id="calcWrap"></div>
</aside>

<script src="./js/app.js" defer></script>
</body>
</html>
