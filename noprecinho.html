  --soft:rgba(245,158,11,.16); --good:#B45309; --bad:#B91C1C; --bad-bg:rgba(185,28,28,.10);
  --focus:#B45309; --shadow:rgba(18,18,20,.45); --danger:#DC2626; --danger-bg:rgba(220,38,38,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--mono)}
main{max-width:1040px;margin:0 auto;padding:18px 16px 48px}
h1,h2,h3,th{font-family:var(--slab)}
h1{font-size:clamp(1.4rem,4vw,2rem);line-height:1.2;margin:0;font-weight:700}
h2{font-size:1.2rem;margin:0;font-weight:700}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.lead{margin:6px 0 20px;color:var(--muted);max-width:none;font-size:.9rem}
.iconbtn{flex:none;width:44px;height:44px;padding:0;display:grid;place-items:center;background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:50%}
.iconbtn svg{width:22px;height:22px}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
#status{min-height:1.4em;color:var(--good);font-weight:700;font-size:.9rem;margin:10px 0 0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
label{font-weight:700;font-size:.88rem}
.hint{font-size:.78rem;color:var(--muted);margin:0 0 14px}
input,select{font:16px/1.4 var(--mono);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:7px;padding:10px 11px;width:100%;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
input[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:.8rem;min-height:1.2em}
.row2{display:grid;grid-template-columns:1fr 96px;gap:8px}
button{font:700 .9rem var(--mono);border-radius:7px;min-height:44px;padding:9px 16px;cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.small{min-height:36px;padding:5px 10px;font-size:.8rem}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.9rem;font-weight:700}
td .big{font:700 1.02rem/1.3 var(--mono);font-variant-numeric:tabular-nums;display:block}
td .sub{display:block;font-size:.76rem;color:var(--muted)}
td.name{font-family:var(--slab);font-weight:700}
tr.sel td{background:var(--soft)}
.chip{display:inline-block;margin-top:4px;padding:1px 9px;border-radius:99px;font-size:.74rem;font-weight:700;background:var(--soft);color:var(--good)}
.chip.up{background:var(--bad-bg);color:var(--bad)}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);margin:6px 0}
.note{background:var(--bad-bg);color:var(--bad);padding:8px 12px;border-radius:7px;margin-bottom:14px;font-size:.85rem}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:20px;width:min(460px,calc(100% - 28px));max-height:calc(100% - 28px);overflow:auto}
dialog::backdrop{background:var(--shadow)}
.dlghead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.dlgfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:6px}
.toolbar{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.toolbar button{text-align:left}
h3.sec{font-size:.95rem;margin:0 0 6px}
#impMsg{white-space:pre-line;font-size:.8rem;margin:10px 0 0;min-height:1.2em}
#impMsg.bad{color:var(--bad)} #impMsg.ok{color:var(--good)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
#scrim{position:fixed;inset:0;background:var(--shadow);opacity:0;visibility:hidden;z-index:19}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto;transform:translateX(100%);visibility:hidden;z-index:20}
body.open #drawer{transform:none;visibility:visible}
body.open #scrim{opacity:1;visibility:visible}
@media (prefers-reduced-motion:no-preference){
  #drawer{transition:transform .22s ease,visibility .22s}
  #scrim{transition:opacity .22s,visibility .22s}
}
.calc{font-size:.85rem;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px;overflow-x:auto;line-height:1.9}
.calc div{white-space:pre}
.result{font-weight:700}
.result.up{color:var(--bad)} .result.ok{color:var(--good)}
@media (max-width:760px){
  #tableWrap thead{position:absolute;left:-9999px}
  #tableWrap table,#tableWrap tbody,#tableWrap tr,#tableWrap td{display:block;width:100%}
  #tableWrap tr{position:relative;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;padding:6px 4px}
  #tableWrap td{border:0;padding:7px 10px}
  #tableWrap td::before{content:attr(data-label);display:block;font:700 .74rem var(--slab);color:var(--muted)}
  #tableWrap td.act::before,#tableWrap td.trashcell::before{display:none}
  #tableWrap td.name{padding-right:56px}
  #tableWrap td.trashcell{position:absolute;top:0;right:0;width:48px;height:48px;padding:0}
  #tableWrap .rowbtns{grid-auto-flow:column;width:auto}
  tr.sel{outline:2px solid var(--accent)}
  #tableWrap tr.sel td{background:transparent}
}
input,select{border-color:var(--steel)}
input::placeholder{color:var(--steel)}
.pr{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.pr .big{display:inline-block;transform-origin:left center}
.pr .norm{color:var(--muted);font-weight:400;font-size:.88rem;font-variant-numeric:tabular-nums;border-left:1px solid var(--steel);padding-left:10px}
td.lowcell{position:relative}
button:not(.ghost):not(.danger):hover{box-shadow:0 0 18px rgba(var(--accent-rgb),.38)}
button.ghost:hover,.iconbtn:hover{border-color:var(--accent);color:var(--accent-text)}
.chip.new{background:var(--accent);color:var(--accent-ink)}
.spark,.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:3}
.ring{width:28px;height:28px;border:2px solid var(--accent);transform:translate(-50%,-50%)}
@keyframes dlgin{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes flashbg{0%{background:rgba(var(--accent-rgb),.38)}100%{background:rgba(var(--accent-rgb),0)}}
@keyframes pricepop{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes glow{0%,30%{text-shadow:0 0 16px rgb(var(--accent-rgb)),0 0 34px rgba(var(--accent-rgb),.7)}100%{text-shadow:0 0 0 transparent}}
@keyframes chippop{0%{transform:scale(0) rotate(-8deg)}100%{transform:none}}
@keyframes slidein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#status.low{text-shadow:0 0 12px rgba(var(--accent-rgb),.6)}
@media (prefers-reduced-motion:no-preference){
  dialog[open]{animation:dlgin .2s ease-out}
  dialog[open]::backdrop{animation:fadein .2s ease-out}
  tr.celebrate td{animation:flashbg 1.8s ease-out}
  tr.celebrate .lowcell .big{animation:pricepop .9s cubic-bezier(.3,1.5,.5,1),glow 1.8s ease-out}
  .chip.new.pop{animation:chippop .6s cubic-bezier(.3,1.7,.5,1)}
  #status.low{animation:slidein .4s ease-out}
  button,.iconbtn{transition:box-shadow .2s,border-color .2s,color .2s}
}
#sumH{font-size:1.6rem;line-height:1.2}
thead th{font-size:1.05rem;background:var(--head-bg);color:var(--ink);padding:14px 10px;border-bottom:2px solid var(--accent)}
thead th:first-child{border-top-left-radius:8px}
thead th:last-child{border-top-right-radius:8px}
h1 .brand{color:var(--accent-text)}
h1 .tt{font-weight:400;font-size:.52em;color:var(--muted);margin-left:.15em;white-space:nowrap}
h1 .tt::before{content:"— "}
.hbtns{display:flex;gap:8px;flex:none}
.ico-moon{display:none}
:root[data-theme="light"] .ico-sun{display:none}
:root[data-theme="light"] .ico-moon{display:block}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between;align-items:center}
footer p{margin:0}
footer a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--steel);text-underline-offset:3px}
footer a:hover{color:var(--accent-text);text-decoration-color:currentColor}
footer .sep{margin:0 .6em;opacity:.6}
@media (prefers-reduced-motion:no-preference){
  body,section.panel,dialog,#drawer,input,select{transition:background-color .25s,color .25s,border-color .25s}
}
td.act{vertical-align:middle}
.rowbtns{display:grid;gap:6px;width:max-content}
.rowbtns button{min-height:30px;padding:3px 12px;font-size:.78rem;font-weight:400;color:var(--muted);border-color:var(--line);text-align:center}
.rowbtns button:hover{color:var(--accent-text);border-color:var(--accent)}
td.trashcell{width:50px;height:1px;padding:0;vertical-align:middle}
button.trash{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:44px;padding:0;border:0;border-radius:0;background:transparent;color:var(--steel)}
button.trash svg{width:19px;height:19px}
button.trash:hover,button.trash:focus-visible{color:var(--danger);background:var(--danger-bg)}
button.trash.trash:hover{box-shadow:none}
button.trash:focus-visible{outline-offset:-3px}
table.hist{font-size:.8rem}
table.hist th{font:700 .78rem var(--slab);background:var(--head-bg);padding:8px;border-bottom:1px solid var(--line)}
table.hist td{padding:9px 8px}
table.hist td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
table.hist tr.low td{background:var(--soft)}
table.hist .chip{margin:3px 4px 0 0}
</style>
</head>
<body>
<main>

<dialog id="addDlg" aria-labelledby="addH">
  <form id="form" novalidate>

  function setErr(n,m){$(n+"Err").textContent=m||"";f[n].setAttribute("aria-invalid",m?"true":"false");}
  function validate(){
    var ok=true,first=null;
    function bad(n,m){setErr(n,m);ok=false;if(!first)first=f[n];}
    var prod=norm(f.product.value),store=norm(f.store.value),raw=f.price.value.trim(),c=parsePrice(raw);
    var sraw=f.size.value.trim(),sz=null;
    ["product","price","size","store"].forEach(function(n){setErr(n);});
    if(!prod)bad("product",t("eProduct"));
    if(!raw)bad("price",t("ePriceEmpty"));
    else if(c===null)bad("price",t("ePriceBad"));
    else if(c<=0)bad("price",t("ePriceZero"));
    else if(c>10000000)bad("price",t("ePriceHigh"));
    if(sraw){
      sz=parseSize(sraw);
      if(sz===null||sz<=0)bad("size",t("eSizeBad"));
      else if(sz>1000000)bad("size",t("eSizeHigh"));
    }
    if(!store)bad("store",t("eStore"));
    if(first)first.focus();
    return ok?{product:prod,store:store,cents:c,size:sz,unit:$("unit").value}:null;
  }
  $("openAdd").onclick=function(){
    $("form").reset();["product","price","size","store"].forEach(function(n){setErr(n);});
    $("addDlg").showModal();f.product.focus();
  };
  $("cancelAdd").onclick=function(){$("addDlg").close();};
  ["addDlg","setDlg"].forEach(function(id){
    $(id).addEventListener("click",function(e){if(e.target===this)this.close();});
  });
  ["product","price","size","store"].forEach(function(n){f[n].addEventListener("input",function(){setErr(n);});});

  $("form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var v=validate();if(!v)return;
    canon(v);
    var key=keyOf(v.product);
    var inGroup=function(){return log.filter(function(e){return e.key===key;});};
    var prev=inGroup().length?stats(inGroup()):null;
    var entry={id:nextId(),key:key,product:v.product,store:v.store,cents:v.cents,date:todayStr()};
    if(v.size){entry.size=v.size;entry.unit=v.unit;}
    log.push(entry);save(LOG_KEY,log);
    // a "new historical low" must beat the previous lowest on a like-for-like basis
    var comparable=prev&&((prev.lowest.size&&entry.size&&prev.lowest.unit===entry.unit)||(!prev.lowest.size&&!entry.size));
    var isLow=!!comparable&&stats(inGroup()).lowest.id===entry.id&&metric(entry)<metric(prev.lowest);
    flashKey=key;celebrate={key:key,on:isLow,fresh:isLow};
    render();
    $("addDlg").close();
    var s=$("status");
    s.className=isLow?"low":"";
    s.textContent=t(isLow?"lowSaved":"saved",{p:v.product,v:money(v.cents),s:v.store});
    if(isLow)burst(key);
    setTimeout(function(){flashKey=null;celebrate.on=false;s.textContent="";s.className="";render();},5500);
  });

  // ---------- CSV import ----------
  function parseCSV(text){
    text=text.replace(/^\ufeff/,"");
    var first=text.split(/\r?\n/)[0]||"";
    var sep=first.split(";").length>first.split(",").length?";":",";
    var rows=[],row=[],cur="",q=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(q){
        if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}
        else cur+=c;
      }else if(c==='"')q=true;
      else if(c===sep){row.push(cur);cur="";}
      else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";rows.push(row);row=[];}
      else cur+=c;
    }
    if(cur!==""||row.length){row.push(cur);rows.push(row);}
    return rows.filter(function(r){return r.some(function(x){return x.trim()!=="";});});
  }
  function hkey(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z]/g,"");}
  function parseDate(s){
    var m,y,mo,d;s=s.trim();
    if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){y=+m[1];mo=+m[2];d=+m[3];}
    else if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))){d=+m[1];mo=+m[2];y=+m[3];}
    else return null;
    var dt=new Date(y,mo-1,d);
    if(dt.getFullYear()!==y||dt.getMonth()!==mo-1||dt.getDate()!==d)return null;
    var iso=y+"-"+pad(mo)+"-"+pad(d);
    return iso>todayStr()?null:iso;
  }
  function parsePack(sraw,uraw){ // -> {size,unit} in g/ml, or null
    var m=sraw.trim().match(/^([\d.,]+)\s*([^\d\s]*)$/);
    if(!m)return null;
    var n=normNum(m[1]);if(n===null)return null;
    n=parseFloat(n);if(!(n>0))return null;
    var u=hkey(m[2]||uraw||""),mult={g:1,gr:1,grama:1,gramas:1,kg:1000,quilo:1000,quilos:1000,ml:1,l:1000,lt:1000,litro:1000,litros:1,un:1,und:1,unid:1,unidade:1,unidades:1,unit:1,units:1,u:1};
    if(!(u in mult))return null;
    var unit=/^(g|gr|grama|gramas|kg|quilo|quilos)$/.test(u)?"g":/^(un|und|unid|unidade|unidades|unit|units|u)$/.test(u)?"un":"ml";
    var size=Math.round(n*mult[u]*100)/100;
    return size>0&&size<=1000000?{size:size,unit:unit}:null;
  }
  function importCSV(text){
    var rows=parseCSV(text);
    if(rows.length<2)return {fatal:t("impEmpty")};
    var head=rows[0].map(hkey),col={};
    var alias={date:["date","data"],product:["product","produto"],price:["price","preco","valor"],store:["store","local","loja","mercado","onde"],size:["size","quantity","quantidade","qtd","embalagem","tamanho"],unit:["unit","unidade"]};
    Object.keys(alias).forEach(function(k){col[k]=head.findIndex(function(h){return alias[k].indexOf(h)>-1;});});
    if(col.product<0||col.price<0||col.store<0)return {fatal:t("impHeader")};
    function g(r,k){return col[k]>=0&&r[col[k]]!==undefined?r[col[k]].trim():"";}
    var sig={};
    log.forEach(function(e){sig[[e.date,e.key,e.cents,e.store.toLowerCase(),e.size||"",e.unit||""].join("|")]=1;});
    var res={added:0,dup:0,errs:[]};
    for(var i=1;i<rows.length;i++){
      var r=rows[i],msg=null;
      var v={product:norm(g(r,"product")),store:norm(g(r,"store"))};
      var cents=parsePrice(g(r,"price")),date=todayStr(),pk=null;
      if(!v.product||!v.store)msg="iProd";
      else if(cents===null||cents<=0||cents>10000000)msg="iPrice";
      if(!msg&&g(r,"date")){date=parseDate(g(r,"date"));if(!date)msg="iDate";}
      if(!msg&&g(r,"size")){pk=parsePack(g(r,"size"),g(r,"unit"));if(!pk)msg="iSize";}
      if(msg){res.errs.push(t("impLine",{n:i+1,m:t(msg)}));continue;}
      canon(v);
      var key=keyOf(v.product);
      var s=[date,key,cents,v.store.toLowerCase(),pk?pk.size:"",pk?pk.unit:""].join("|");
      if(sig[s]){res.dup++;continue;}
      sig[s]=1;
      var entry={id:nextId(),key:key,product:v.product,store:v.store,cents:cents,date:date};
      if(pk){entry.size=pk.size;entry.unit=pk.unit;}
      log.push(entry);res.added++;
    }
    if(res.added)save(LOG_KEY,log);
    return res;
  }
  function showImp(msg,cls){var m=$("impMsg");m.textContent=msg;m.className=cls||"";}
  $("impBtn").onclick=function(){$("impFile").click();};
  $("impFile").onchange=function(){
    var file=this.files&&this.files[0],input=this;
    if(!file)return;
    file.arrayBuffer().then(function(buf){
      var text;
      try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf);}
      catch(e){text=new TextDecoder("windows-1252").decode(buf);}
      var res=importCSV(text);
      if(res.fatal){showImp(res.fatal,"bad");}
      else{
        var lines=[t("impDone",{a:res.added,d:res.dup,e:res.errs.length})].concat(res.errs.slice(0,5));
        if(res.errs.length>5)lines.push(t("iMore",{n:res.errs.length-5}));
        showImp(lines.join("\n"),res.errs.length?"bad":"ok");
        render();
      }
      input.value="";
    }).catch(function(){showImp(t("impRead"),"bad");input.value="";});
  };

  // ---------- settings dialog ----------
  $("themeBtn").onclick=function(){settings.theme=settings.theme==="light"?"dark":"light";save(SET_KEY,settings);applyTheme();};
  $("openSettings").onclick=function(){
    $("lang").value=settings.lang;$("currency").value=settings.currency;$("decimal").value=settings.decimal;
    showImp("");
    $("setDlg").showModal();
  };
  $("closeSet").onclick=function(){$("setDlg").close();};
  $("lang").onchange=function(){settings.lang=this.value;save(SET_KEY,settings);applyLang();render();};
  $("currency").oninput=function(){settings.currency=this.value.trim();save(SET_KEY,settings);render();};
  $("decimal").onchange=function(){settings.decimal=this.value;save(SET_KEY,settings);render();};

  function csv(rows){
    var sep=settings.decimal===","?";":",";
    return rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(sep);}).join("\r\n");
  }
  function plain(c){var s=(c/100).toFixed(2);return settings.decimal===","?s.replace(".",","):s;}
  function download(name,text){
    var blob=new Blob(["\ufeff"+text],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
  }
  $("expSummary").onclick=function(){
    var rows=[t("csvSummary")];
    function pk(e){return e.size?plainNum(e.size)+e.unit:"";}
    function np(e){var n=nominal(e);return n?plain(n.cents)+"/"+n.u:"";}
    summarize().forEach(function(g){
      rows.push([g.name,plain(g.lowest.cents),pk(g.lowest),np(g.lowest),g.lowest.store,g.lowest.date,
        plain(g.latest.cents),pk(g.latest),np(g.latest),g.latest.store,g.latest.date]);
    });
    download(t("fileSummary"),csv(rows));
  };
  $("expLog").onclick=function(){
    var rows=[t("csvLog")];
    log.slice().sort(chrono).forEach(function(e){rows.push([e.date,e.product,plain(e.cents),e.store,e.size?plainNum(e.size):"",e.unit||""]);});
    download(t("fileLog"),csv(rows));
  };
  $("wipe").onclick=function(){
    if(log.length&&confirm(t("confirmWipe"))){log=[];save(LOG_KEY,log);calcKey=null;closeCalc();render();}
  };

  $("storageNote").hidden=storageOk;
  applyLang();render();
})();
</script>
